# SQLite is used in development and test. Production uses PostgreSQL (Supabase).
#   gem install sqlite3
#   gem install pg
#
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
# Set TEST_DATABASE_URL to run the test suite against PostgreSQL;
# the default remains SQLite.
test:
<% if ENV["TEST_DATABASE_URL"] %>
  url: <%= ENV["TEST_DATABASE_URL"] %>
<% else %>
  <<: *default
  database: storage/test.sqlite3
<% end %>

# Production is a single PostgreSQL database (Supabase session pooler).
# Session pooler (host ...pooler.supabase.com:5432) supports prepared
# statements and advisory locks, so no extra settings are required.
#
# If you switch to the transaction pooler (port 6543), uncomment both:
#   prepared_statements: false
#   advisory_locks: false
production:
  url: <%= ENV["DATABASE_URL"] %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 3) %>
  sslmode: require
  # prepared_statements: false
  # advisory_locks: false
