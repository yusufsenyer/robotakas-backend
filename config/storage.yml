test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Supabase Storage (S3-compatible). Bucket must be PRIVATE: Active Storage
# serves files through signed, expiring URLs, not public URLs.
supabase:
  service: S3
  endpoint: <%= ENV["SUPABASE_S3_ENDPOINT"] %>
  region: <%= ENV["SUPABASE_S3_REGION"] %>
  bucket: <%= ENV["SUPABASE_S3_BUCKET"] %>
  access_key_id: <%= ENV["SUPABASE_S3_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["SUPABASE_S3_SECRET_ACCESS_KEY"] %>
  force_path_style: true
  # Newer aws-sdk-s3 versions add request/response checksums by default, which
  # some S3-compatible services reject. Only use them when the service asks.
  request_checksum_calculation: when_required
  response_checksum_validation: when_required

# Remember not to checkin your GCS keyfile to a repository
